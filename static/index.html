<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PDF 标签处理工具 by kong v20</title>
  <style>
    :root { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", Arial, sans-serif; color:#172033; background:#f6f7fb; }
    body { margin:0; padding:32px 16px; }
    .wrap { max-width:920px; margin:0 auto; }
    .card { background:#fff; border:1px solid #e6e9f2; border-radius:18px; box-shadow:0 10px 30px rgba(20,30,60,.06); padding:28px; }
    h1 { margin:0 0 8px; font-size:28px; }
    .byline { font-size:18px; color:#657087; font-weight:700; margin-left:6px; }
    .sub { color:#657087; margin:0 0 24px; line-height:1.7; }
    label { display:block; font-weight:700; margin:18px 0 8px; }
    input[type="file"], select, input[type="number"] { width:100%; box-sizing:border-box; border:1px solid #d7dce8; border-radius:12px; padding:12px; font-size:15px; background:#fff; }
    .grid { display:grid; grid-template-columns:1fr 1fr; gap:18px; }
    .checks { display:grid; gap:10px; margin-top:16px; }
    .check { display:flex; align-items:center; gap:10px; color:#243047; }
    button { margin-top:24px; border:0; border-radius:14px; background:#18233f; color:#fff; padding:14px 20px; font-size:16px; font-weight:700; cursor:pointer; }
    button:disabled { opacity:.55; cursor:not-allowed; }
    .hint { background:#f1f5ff; border:1px solid #dbe6ff; color:#33415f; border-radius:14px; padding:14px; line-height:1.7; margin:18px 0; }
    #result { margin-top:18px; white-space:pre-wrap; line-height:1.7; color:#243047; }
    a.download { display:inline-block; margin-top:12px; color:#0b57d0; font-weight:700; }
    @media (max-width:720px){ .grid{grid-template-columns:1fr;} body{padding:16px 10px;} .card{padding:20px;} }
  </style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>PDF 标签处理工具 <span class="byline">by kong</span></h1>
    <p class="sub">本版优先使用 PDF 文本流替换目的地行的 <b>FBA: 公司名</b> 为 <b>FBA</b>，不再使用横向白框擦除，避免挡住右侧发货地姓名、仓库代码和地址。</p>

    <form id="form">
      <label>上传 PDF 或 ZIP</label>
      <input id="file" name="file" type="file" accept=".pdf,.zip" required />

      <div class="grid">
        <div>
          <label>裁剪尺寸</label>
          <select name="size">
            <option value="10x8">10 × 8 cm</option>
            <option value="10x10">10 × 10 cm</option>
            <option value="10x15">10 × 15 cm</option>
          </select>
        </div>
        <div>
          <label>命名方式</label>
          <select name="naming_mode">
            <option value="seller">按 SellerSKU 命名</option>
            <option value="warehouse">按仓库 SKU 映射命名</option>
          </select>
        </div>
      </div>

      <label>仓库 SKU 映射表，可选 xlsx/csv</label>
      <input name="mapping_file" type="file" accept=".xlsx,.xlsm,.csv" />

      <div class="checks">
        <label class="check"><input name="group_by_sku" type="checkbox" checked /> 先识别分组，同一 SKU 合并为一个 PDF</label>
        <label class="check"><input name="add_made" type="checkbox" /> 添加 Made In China</label>
      </div>

      <div>
        <label>Made In China 字号</label>
        <input name="made_font_size" type="number" value="8" min="5" max="18" step="0.5" />
      </div>

      <div class="hint">v20 修复点：保留“目的地：”、保留 FBA、保留 TOL3/ONT8 等仓库代码；仅去掉目的地 FBA 后面的冒号、公司名/地址信息。若遇到无法识别的特殊 PDF，不做破坏性擦除，避免遮挡其他文字。</div>

      <button id="btn" type="submit">开始处理并下载 ZIP</button>
    </form>
    <div id="result"></div>
  </div>
</div>
<script>
const form = document.getElementById('form');
const btn = document.getElementById('btn');
const result = document.getElementById('result');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  btn.disabled = true;
  result.textContent = '处理中，请稍等...';
  const fd = new FormData(form);
  fd.set('group_by_sku', form.group_by_sku.checked ? 'true' : 'false');
  fd.set('add_made', form.add_made.checked ? 'true' : 'false');
  try {
    const res = await fetch('/api/process', { method: 'POST', body: fd });
    if (!res.ok) {
      let msg = await res.text();
      try { msg = JSON.parse(msg).detail || msg; } catch(e) {}
      throw new Error(msg);
    }
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'PDF标签处理结果.zip';
    a.className = 'download';
    a.textContent = '下载处理结果 ZIP';
    result.textContent = '处理完成。';
    result.appendChild(document.createElement('br'));
    result.appendChild(a);
    a.click();
  } catch (err) {
    result.textContent = '处理失败：' + err.message;
  } finally {
    btn.disabled = false;
  }
});
</script>
</body>
</html>
